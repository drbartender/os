<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="_ds/dr-bartender-os-design-system-72035042-c993-47e2-9dc8-c452b7bf5fa4/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/dr-bartender-os-design-system-72035042-c993-47e2-9dc8-c452b7bf5fa4/tokens/colors.css">
  <style>html,body{margin:0;background:#15171b}a{color:#b8c0cc}a:hover{color:#eef1f4}</style>
</helmet>
<div style="padding:48px 56px 72px;font-family:Inter, sans-serif;color:#eef1f4;display:flex;flex-direction:column;gap:28px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:22px;font-weight:600">Bar menu · phone</div>
    <div style="font-size:13px;color:#b8c0cc;max-width:720px;line-height:1.5">Event card, menu viewer and quick edits under 700px. Phones view, tweak and approve. Text and brief edits stay on desktop. Every screen is live: tap View, tap a drink, open Edit.</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:#7c8593">01 · Event · Bar menu card</div>
      <dc-import name="Menu Phone" skin="{{ skin }}" start-screen="event" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:#7c8593">02 · Bar menu · view</div>
      <dc-import name="Menu Phone" skin="{{ skin }}" start-screen="menu" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:#7c8593">03 · Edit sheet</div>
      <dc-import name="Menu Phone" skin="{{ skin }}" start-screen="menu" start-sheet="edit" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:#7c8593">04 · Drink sheet</div>
      <dc-import name="Menu Phone" skin="{{ skin }}" start-screen="menu" start-sheet="drink" hint-size="390px,844px"></dc-import>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:#7c8593">05 · Approve</div>
      <dc-import name="Menu Phone" skin="{{ skin }}" start-screen="menu" start-sheet="approve" hint-size="390px,844px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;skin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;After Hours&quot;,&quot;House Lights&quot;],&quot;default&quot;:&quot;After Hours&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){ return { skin: this.props.skin ?? 'After Hours' }; }
}
</script>
</body>
</html>
